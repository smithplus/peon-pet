<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' peon-asset:; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self' peon-asset:;">
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 200px; height: 200px; overflow: hidden; background: transparent; }
    canvas { display: block; }
    /* Resize grips: corners only, invisible until the pointer is near them */
    .grip {
      position: absolute;
      width: 20px; height: 20px;
      z-index: 90;
      opacity: 0;
      transition: opacity 120ms ease;
    }
    .grip::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-color: rgba(255, 255, 255, 0.75);
      border-style: solid;
      border-width: 0;
    }
    body:hover .grip { opacity: 0.55; }
    .grip:hover { opacity: 1 !important; }
    #grip-tl { top: 0; left: 0;  cursor: nwse-resize; }
    #grip-tr { top: 0; right: 0; cursor: nesw-resize; }
    #grip-bl { bottom: 0; left: 0;  cursor: nesw-resize; }
    #grip-br { bottom: 0; right: 0; cursor: nwse-resize; }
    #grip-tl::after { border-top-width: 2px; border-left-width: 2px; }
    #grip-tr::after { border-top-width: 2px; border-right-width: 2px; }
    #grip-bl::after { border-bottom-width: 2px; border-left-width: 2px; }
    #grip-br::after { border-bottom-width: 2px; border-right-width: 2px; }
    #tooltip {
      position: absolute;
      display: none;
      background: rgba(8, 8, 16, 0.88);
      color: #bbb;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 10px;
      line-height: 1.5;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      white-space: nowrap;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="grip" id="grip-tl"></div>
  <div class="grip" id="grip-tr"></div>
  <div class="grip" id="grip-bl"></div>
  <div class="grip" id="grip-br"></div>
  <div id="tooltip"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
